# The khora log on NATS JetStream.
#
# KHORA_NATS_SYNC picks the disk sync of the `nats` service, per deployment:
#   always  (default) nats/nats-server-always-sync.conf: every write is synced to disk before it
#                     is acknowledged.
#   default           nats/nats-server-default-sync.conf: NATS's default, a sync every 2 minutes;
#                     a host crash can lose recent acknowledged writes.
# For example: KHORA_NATS_SYNC=default docker compose up -d nats
#
# `nats-default-sync` (client port 4223, monitor 8223) runs the default-sync config next to `nats`,
# with its own volume, so the benchmark (./gradlew :log-nats:bench) can measure both side by side.
#
# The image is pinned: NatsEventLog's duplicate handling depends on server behaviour observed on
# 2.12.15 (error 10201 for a batch that holds a stored event id; the duplicate check runs before
# the expected-last-msg-id check). AtomicBatchSpikeTest pins that behaviour; NatsTestServer uses
# the same image. Upgrade all three together.
#
# `neo4j` runs the graph datastore's database (Neo4jDatastore), Bolt on 7687, browser on 7474. Its
# password is KHORA_NEO4J_PASSWORD, by default khora-dev-password. The image is pinned, as in
# Neo4jTestServer; upgrade both together.
#
# Ports are published on 127.0.0.1 only: this is a development setup, without authentication for NATS.
services:
  nats:
    image: nats:2.12.15-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ./nats/nats-server-${KHORA_NATS_SYNC:-always}-sync.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data

  nats-default-sync:
    image: nats:2.12.15-alpine
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:4223:4222"
      - "127.0.0.1:8223:8222"
    volumes:
      - ./nats/nats-server-default-sync.conf:/etc/nats/nats-server.conf:ro
      - nats-default-sync-data:/data

  neo4j:
    image: neo4j:2026.10.2-community
    environment:
      NEO4J_AUTH: neo4j/${KHORA_NEO4J_PASSWORD:-khora-dev-password}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:
  nats-data:
  nats-default-sync-data:
