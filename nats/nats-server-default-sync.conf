# NATS server for the khora log with NATS's default disk sync: writes are acknowledged once in the
# server's memory and synced to disk every 2 minutes, so a host crash can lose recent acknowledged
# writes. Pick it with KHORA_NATS_SYNC=default (see docker-compose.yml).
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
}
